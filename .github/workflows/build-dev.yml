name: Build (dev)

permissions: {}

on:
  pull_request:
    branches:
    - main
    - release/*
  # Allow pipeline to be run manually.
  workflow_dispatch:
    inputs:
      runFunctionalTests:
        description: Run functional tests
        required: true
        type: boolean
        default: false
      runVMTests:
        description: Run VMTests suite
        required: true
        type: boolean
        default: false

jobs:
  build:
    # Temporary diagnostic branch: reuse the tested ARM64 container and run only the reproduction job.
    uses: ./.github/workflows/tests-vmtests.yml
    with:
      hostArch: arm64
      hostDistro: ubuntu2404
    permissions:
      contents: read
      actions: read
      # Azure login.
      id-token: write
