name: Tests VMTests suite for imagecustomizer

permissions: {}

on:
  workflow_call:
    inputs:
      hostArch:
        required: true
        type: string
      hostDistro:
        required: true
        type: string

env:
  EXPECTED_GO_VERSION: "1.26.0"

jobs:
  tests-vmtests:
    name: Tests imagecustomizer VMTests suite - ${{ inputs.hostDistro }} ${{ inputs.hostArch }}
    timeout-minutes: 180
    runs-on:
    - self-hosted
    - 1ES.Pool=${{ inputs.hostDistro == 'azl3' && (inputs.hostArch == 'amd64' && 'maritimus-github-runner-azl3-amd64' || 'maritimus-github-runner-azl3-arm64') || (inputs.hostArch == 'amd64' && 'maritimus-github-runner-ubuntu2404-amd64' || 'maritimus-github-runner-ubuntu2404-arm64') }}
    - JobId=azl-ic-tests-vmtests-${{ inputs.hostDistro }}-${{ inputs.hostArch }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
    permissions:
      contents: read
      actions: read
      # Azure login.
      id-token: write
    environment: public
    steps:
    - name: setup go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "~${{ env.EXPECTED_GO_VERSION }}"

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: repo
        persist-credentials: false

    - name: Install prerequisites (AZL3)
      if: inputs.hostDistro == 'azl3'
      run: |
        set -eux

        sudo ./repo/.github/workflows/scripts/retry.sh 5 5 \
            tdnf install -y \
            libvirt libvirt-daemon libvirt-daemon-config-network \
            libvirt-daemon-kvm libvirt-devel qemu-kvm qemu-img python3-libvirt \
            python3-devel edk2-ovmf \
            azure-cli

        sudo tdnf list installed

        sudo systemctl restart libvirtd
        sudo systemctl status libvirtd

    - name: Install prerequisites (Ubuntu 24.04)
      if: inputs.hostDistro == 'ubuntu2404'
      run: |
        set -eux

        # Wait for the dpkg lock (held by the runner's background unattended-upgrades) rather than
        # failing. Set it globally so apt invocations inside the Azure CLI install script wait too.
        # Create the apt.conf.d directory if missing; append so an existing config isn't clobbered.
        sudo mkdir -p /etc/apt/apt.conf.d
        echo 'DPkg::Lock::Timeout "600";' | sudo tee -a /etc/apt/apt.conf.d/99lock-timeout

        sudo apt update -y
        sudo apt -y install python3-venv python3-pip python3-dev \
            libvirt-dev libvirt-daemon libvirt-daemon-system libvirt-clients \
            qemu-kvm virt-manager

        # Install arm64 specific
        if [[ "$HOST_ARCH" == "arm64" ]]; then
          sudo apt -y install qemu-system-arm qemu-efi-aarch64 ovmf seabios
        fi

        sudo apt list --installed

        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      env:
        HOST_ARCH: ${{ inputs.hostArch }}

    - name: Azure Login
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Download base images
      run: |
        set -eux

        ./repo/.github/workflows/scripts/download-image.sh "$AZURE_STORAGE" "$AZURE_CONTAINER" "azure-linux/core-efi-vhdx-3.0-$HOST_ARCH" azl-core-efi-3.0 "3.0.20260923"
        sha256sum azl-core-efi-3.0/image.vhdx
      env:
        HOST_ARCH: ${{ inputs.hostArch }}
        AZURE_STORAGE: ${{ vars.AZURE_STORAGE }}
        AZURE_CONTAINER: ${{ vars.AZURE_CONTAINER }}

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: container-arm64
        path: out/container-arm64
        run-id: 36509401783
        github-token: ${{ github.token }}

    - name: Import container
      id: importContainer
      run: |
        set -eux

        CONTAINER_TAR_PATH="out/container-$HOST_ARCH/imagecustomizer.tar.gz"
        DOCKER_OUTPUT=$(sudo docker image load -i "$CONTAINER_TAR_PATH" 2>&1)
        CONTAINER_TAG=$(echo "$DOCKER_OUTPUT" | grep "Loaded image: " | awk '{print $3}')

        echo "containerTag=$CONTAINER_TAG" >> "$GITHUB_OUTPUT"
      env:
        HOST_ARCH: ${{ inputs.hostArch }}

    - name: Test setup
      run: |
        set -eux

        pushd ./repo/test/vmtests

        # Ensure an ssh key exists.
        ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""

        make create-venv

    - name: Run tests
      run: |
        set -eux

        pushd ./repo/test/vmtests

        sudo make test-imagecustomizer \
          IMAGE_CUSTOMIZER_CONTAINER_TAG="$CONTAINER_TAG" \
          CORE_EFI_AZL3="../../../azl-core-efi-3.0/image.vhdx" \
          TEST_FILTER="test_pxe_bootstrap_efi_azl3" \
          SSH_PRIVATE_KEY_FILE=~/.ssh/id_ed25519
      env:
        HOST_ARCH: ${{ inputs.hostArch }}
        CONTAINER_TAG: ${{ steps.importContainer.outputs.containerTag }}

    - name: Capture host diagnostics
      if: ${{ always() }}
      run: |
        sudo install -d -m 0755 -o "$USER" repo/test/vmtests/out/host
        uname -a > repo/test/vmtests/out/host/kernel.txt
        lscpu > repo/test/vmtests/out/host/cpu.txt
        cat /proc/meminfo /proc/loadavg > repo/test/vmtests/out/host/resources.txt
        sudo dmesg --ctime > repo/test/vmtests/out/host/dmesg.txt
        sudo journalctl -b -u libvirtd --no-pager > repo/test/vmtests/out/host/libvirtd.txt

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ always() }}
      with:
        name: tests-results-imagecustomizer-vmtests-${{ inputs.hostDistro }}-${{ inputs.hostArch }}
        path: repo/test/vmtests/out
        retention-days: 7
