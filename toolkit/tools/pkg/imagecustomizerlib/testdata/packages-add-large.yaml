previewFeatures:
- resize-disk

storage:
  resizeDisk:
    partitions:
    - ref: last
      freeSpace: 9G

os:
  bootloader:
    resetType: hard-reset

  packages:
    install:
      # Install a large number of packages, mainly by picking packages with lots of dependencies.
    - llvm
    - gcc
    - clang
    - kubernetes
    - fluent-bit
    - kernel-devel
    - perl
    - python3
    - ocaml
    - mariadb
    - ceph
    - curl
    - lvm2
    - etcd
    - fuse
    - gdb
    - golang
    - grpc
    - java
    - lldb
    - lua
    - moby-engine
    - nodejs
    - postgresql
    - qemu
    - libvirt
    - ruby
    - rust
    - xz
    - zstd
